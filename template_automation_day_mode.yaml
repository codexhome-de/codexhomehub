#DEPLOY_PLACEHOLDER
- id: set_day_mode
  alias: Set Day Mode
  trigger:
    - id: day
      platform: sun
      event: sunrise
      offset: "SUNRISE_OFFSET_PLACEHOLDER"
    - id: evening
      platform: sun
      event: sunset
      offset: "SUNSET_OFFSET_PLACEHOLDER"
    - id: night
      platform: time
      at: "NIGHT_TIME_PLACEHOLDER"
    - id: startup
      platform: homeassistant
      event: start
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: day
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_DAY_PLACEHOLDER"
        - conditions:
            - condition: trigger
              id: evening
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_EVENING_PLACEHOLDER"
        - conditions:
            - condition: trigger
              id: night
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_NIGHT_PLACEHOLDER"
        # Startup: Day
        - conditions:
            - condition: trigger
              id: startup
            - condition: sun
              after: sunrise
              after_offset: "SUNRISE_OFFSET_PLACEHOLDER"
              before: sunset
              before_offset: "SUNSET_OFFSET_PLACEHOLDER"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_DAY_PLACEHOLDER"
        # Startup: Night
        - conditions:
            - condition: trigger
              id: startup
            - condition: or
              conditions:
                - condition: time
                  after: "NIGHT_TIME_PLACEHOLDER"
                - condition: sun
                  before: sunrise
                  before_offset: "SUNRISE_OFFSET_PLACEHOLDER"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_NIGHT_PLACEHOLDER"
        # Startup fallback: Evening
        - conditions:
            - condition: trigger
              id: startup
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_EVENING_PLACEHOLDER"