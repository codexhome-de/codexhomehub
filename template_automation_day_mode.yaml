- id: set_day_mode
  alias: Set Day Mode
  trigger:
    - id: day
      platform: time
      at: "TIME_DAY_PLACEHOLDER"
    - id: evening
      platform: sun
      event: sunset
    - id: night
      platform: time
      at: "TIME_NIGHT_PLACEHOLDER"
    - id: startup
      platform: homeassistant
      event: start
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: day
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_DAY_PLACEHOLDER"
        - conditions:
            - condition: trigger
              id: evening
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_EVENING_PLACEHOLDER"
        - conditions:
            - condition: trigger
              id: night
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_NIGHT_PLACEHOLDER"
        # Startup: Night (late — after NIGHT_TIME)
        - conditions:
            - condition: trigger
              id: startup
            - condition: time
              after: "TIME_NIGHT_PLACEHOLDER"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_NIGHT_PLACEHOLDER"
        # Startup: Night (early — before DAY_TIME)
        - conditions:
            - condition: trigger
              id: startup
            - condition: time
              before: "TIME_DAY_PLACEHOLDER"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_NIGHT_PLACEHOLDER"
        # Startup: Day (between DAY_TIME and sunset)
        - conditions:
            - condition: trigger
              id: startup
            - condition: time
              after: "TIME_DAY_PLACEHOLDER"
            - condition: sun
              before: sunset
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_DAY_PLACEHOLDER"
        # Startup fallback: Evening (after sunset, before NIGHT_TIME)
        - conditions:
            - condition: trigger
              id: startup
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.tech_day_mode_hk
              data:
                option: "NAME_EVENING_PLACEHOLDER"