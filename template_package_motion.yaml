#DEPLOY_PLACEHOLDER
group:
  ROOM_LOWER_PLACEHOLDER_motion_sensors:
    name: "NAME_MOTION_PLACEHOLDER Sensors"
    entities: !include /SENSOR_PLACEHOLDER/ROOM_LOWER_PLACEHOLDER_sensors.yaml

input_boolean:
  ROOM_LOWER_PLACEHOLDER_motion_day:
    name: "NAME_MOTION_DAY_PLACEHOLDER"

  ROOM_LOWER_PLACEHOLDER_motion_evening:
    name: "NAME_MOTION_EVENING_PLACEHOLDER"

  ROOM_LOWER_PLACEHOLDER_motion_night:
    name: "NAME_MOTION_NIGHT_PLACEHOLDER"

timer:
  ROOM_LOWER_PLACEHOLDER_motion_hold:
    name: "NAME_MOTION_PLACEHOLDER Hold"
    duration: "00:01:00"

template:
  - binary_sensor:
      - name: "NAME_MOTION_DAY_PLACEHOLDER"
        unique_id: ROOM_LOWER_PLACEHOLDER_motion_day_hk
        default_entity_id: binary_sensor.ROOM_LOWER_PLACEHOLDER_motion_day_hk
        device_class: motion
        state: "{{ is_state('input_boolean.ROOM_LOWER_PLACEHOLDER_motion_day', 'on') }}"

      - name: "NAME_MOTION_EVENING_PLACEHOLDER"
        unique_id: ROOM_LOWER_PLACEHOLDER_motion_evening_hk
        default_entity_id: binary_sensor.ROOM_LOWER_PLACEHOLDER_motion_evening_hk
        device_class: motion
        state: "{{ is_state('input_boolean.ROOM_LOWER_PLACEHOLDER_motion_evening', 'on') }}"

      - name: "NAME_MOTION_NIGHT_PLACEHOLDER"
        unique_id: ROOM_LOWER_PLACEHOLDER_motion_night_hk
        default_entity_id: binary_sensor.ROOM_LOWER_PLACEHOLDER_motion_night_hk
        device_class: motion
        state: "{{ is_state('input_boolean.ROOM_LOWER_PLACEHOLDER_motion_night', 'on') }}"

      - name: "NAME_MOTION_PLACEHOLDER"
        unique_id: ROOM_LOWER_PLACEHOLDER_motion_hk
        default_entity_id: binary_sensor.ROOM_LOWER_PLACEHOLDER_motion_hk
        device_class: motion
        state: >
          {{
            is_state('input_boolean.ROOM_LOWER_PLACEHOLDER_motion_day', 'on')
            or is_state('input_boolean.ROOM_LOWER_PLACEHOLDER_motion_evening', 'on')
            or is_state('input_boolean.ROOM_LOWER_PLACEHOLDER_motion_night', 'on')
          }}