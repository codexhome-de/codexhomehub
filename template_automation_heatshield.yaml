#DEPLOY_PLACEHOLDER
- id: set_heatshield_mode
  alias: Set Heatshield Mode
  trigger:
    - id: north
      platform: time
      at: "HEATSHIELD_NORTH_TIME_PLACEHOLDER"
    - id: east
      platform: time
      at: "HEATSHIELD_EAST_TIME_PLACEHOLDER"
    - id: south
      platform: time
      at: "HEATSHIELD_SOUTH_TIME_PLACEHOLDER"
    - id: west
      platform: time
      at: "HEATSHIELD_WEST_TIME_PLACEHOLDER"
  condition:
    - condition: state
      entity_id: input_select.heatshield_mode_hk
      state: "NAME_HEATSHIELD_AUTO_PLACEHOLDER"
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: north
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.heatshield_mode_hk
              data:
                option: "NAME_HEATSHIELD_NORTH_PLACEHOLDER"
        - conditions:
            - condition: trigger
              id: east
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.heatshield_mode_hk
              data:
                option: "NAME_HEATSHIELD_EAST_PLACEHOLDER"
        - conditions:
            - condition: trigger
              id: south
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.heatshield_mode_hk
              data:
                option: "NAME_HEATSHIELD_SOUTH_PLACEHOLDER"
        - conditions:
            - condition: trigger
              id: west
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.heatshield_mode_hk
              data:
                option: "NAME_HEATSHIELD_WEST_PLACEHOLDER"
- id: heatshield_mode_memory
  alias: Heatshield Mode Memory
  trigger:
    - platform: state
      entity_id: input_select.heatshield_mode_hk
  action:
    - choose:
        # The mode just became East, South, or West
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.to_state.state in [
                     'NAME_HEATSHIELD_NORTH_PLACEHOLDER',
                     'NAME_HEATSHIELD_EAST_PLACEHOLDER',
                     'NAME_HEATSHIELD_SOUTH_PLACEHOLDER',
                     'NAME_HEATSHIELD_WEST_PLACEHOLDER'
                   ] }}
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ trigger.from_state.state in [
                         'NAME_HEATSHIELD_OFF_PLACEHOLDER',
                         'NAME_HEATSHIELD_AUTO_PLACEHOLDER'
                       ] }}
              then:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.heatshield_last_persistent
                  data:
                    option: "{{ trigger.from_state.state }}"
            - action: input_select.select_option
              target:
                entity_id: input_select.heatshield_mode_hk
              data:
                option: "{{ states('input_select.heatshield_last_persistent') }}"